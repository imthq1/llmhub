spring.application.name=llmhub

# Local secrets/configuration are loaded from the ignored .env file.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Never commit actual values. Set these through environment variables or your secret manager.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/login/oauth2/code/google}

# Google OAuth endpoints used by GoogleUtils
google.link.get.token=https://oauth2.googleapis.com/token
google.link.get.user_info=https://www.googleapis.com/oauth2/v2/userinfo?access_token=

# 32-byte key encoded as Base64; generate a distinct value for each environment.
imthang.jwt.base64-secret=${JWT_BASE64_SECRET}
imthang.jwt.access-token-validity-in-seconds=${JWT_ACCESS_TOKEN_TTL:900}
imthang.jwt.refresh-token-validity-in-seconds=${JWT_REFRESH_TOKEN_TTL:2592000}

# Keep true in production (HTTPS). Set false only for local HTTP development.
app.auth.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:true}
